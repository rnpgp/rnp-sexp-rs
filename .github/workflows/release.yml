# Release pipeline for rnp-sexp-rs
#
# release-plz runs on every push to main. If it detects conventional commits
# that warrant a version bump, it opens a "release PR" with the bumped version
# and updated CHANGELOG. When that PR merges, release-plz runs again and
# publishes the new version to crates.io.
#
# Required secrets (Settings → Secrets and variables → Actions):
#   CARGO_REGISTRY_TOKEN  — crates.io publish token (or CARGO_REGISTRY_GIT_TOKEN for the git origin)
#   RNP_SEXP_CI_PAT_TOKEN — GitHub PAT with `repo` + `workflow` scopes so the
#                           release PR can trigger downstream CI workflows
#
# See: https://release-plz.dev/docs/config

name: Release

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - main

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.RNP_SEXP_CI_PAT_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
