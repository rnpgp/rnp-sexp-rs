# Continuous Integration for rnp-sexp-rs
#
# Adapted from parsanol-rs. Implements Rust best practices:
# - Spell check with typos
# - Security audit with cargo-deny and cargo-audit
# - Multi-platform testing (Linux, Windows, macOS; x64 and ARM64)
# - MSRV + stable + beta Rust testing
# - Code coverage with llvm-cov
# - Documentation build
# - Semver compatibility check on PRs

name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_BUILD_JOBS: 4
  RUST_BACKTRACE: short
  RUSTFLAGS: "-D warnings"

jobs:
  # ============================================================================
  # Typos Check
  # ============================================================================
  typos:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.48.0

  # ============================================================================
  # Pre-flight Checks
  # ============================================================================
  preflight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check if code changed
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          elif git diff --name-only HEAD^ HEAD | grep -qE '\.(rs|toml|lock)$'; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  # ============================================================================
  # Security Audit
  # ============================================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Generate Cargo.lock
        run: cargo generate-lockfile

      - name: Run cargo-audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check licenses and advisories
        run: cargo deny check licenses advisories

  # ============================================================================
  # Format and Lint
  # ============================================================================
  lint:
    name: Format and Lint
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo tools
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check documentation
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  # ============================================================================
  # Check Unused Dependencies
  # ============================================================================
  machete:
    name: Check Unused Dependencies
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: Check for unused dependencies
        run: cargo machete

  # ============================================================================
  # Publish Check (Dry Run)
  # ============================================================================
  publish-check:
    name: Publish Check
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Publish check
        run: cargo publish --dry-run

  # ============================================================================
  # Test Matrix (Multi-platform, Multi-arch)
  # ============================================================================
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    needs: [preflight]
    if: needs.preflight.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04           # Linux x64
          - ubuntu-22.04-arm       # Linux ARM64
          - windows-latest         # Windows x64
          - windows-11-arm         # Windows ARM64
          - macos-15               # macOS (Apple Silicon)
          - macos-15-intel         # macOS Intel
        rust: [stable]
        include:
          # MSRV check - declared in Cargo.toml as 1.70
          - os: ubuntu-22.04
            rust: "1.70"
            name: Test MSRV
          # Beta for early warning
          - os: ubuntu-22.04
            rust: beta
            name: Test Beta
            continue-on-error: true
    continue-on-error: ${{ matrix.continue-on-error || false }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.rust }}
          cache-on-failure: true

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Run doc tests
        run: cargo test --doc

  # ============================================================================
  # Code Coverage
  # ============================================================================
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [preflight]
    if: needs.preflight.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
          flags: unittests
          name: codecov-umbrella

  # ============================================================================
  # Documentation
  # ============================================================================
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: [preflight]
    if: needs.preflight.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build documentation
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Upload documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: target/doc
          retention-days: 7

  # ============================================================================
  # Semver Check
  # ============================================================================
  semver:
    name: Semver Compatibility
    runs-on: ubuntu-latest
    needs: [preflight]
    if: needs.preflight.outputs.should_run == 'true' && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks

      - name: Check semver compatibility
        run: cargo semver-checks --baseline-rev origin/${{ github.base_ref }}

  # ============================================================================
  # Summary
  # ============================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [typos, security, lint, machete, publish-check, test, coverage, docs]
    if: always() && !contains(needs.*.result, 'failure')
    steps:
      - name: Report success
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All CI checks passed!" >> $GITHUB_STEP_SUMMARY
