# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/index.html

# This file configures cargo-deny for security and license checking

[advisories]
# Security advisories from RustSec
version = 2
# Ignore specific advisories if needed
# ignore = [
#     { id = "RUSTSEC-0000-0000", reason = "..." }
# ]

[licenses]
# License checking configuration
version = 2

# Allow these licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
]

# Confidence threshold for evaluating a license
confidence-threshold = 0.8

[bans]
# Warn about multiple versions of the same crate
multiple-versions = "warn"
# Warn about wildcards in dependencies
wildcards = "warn"

[sources]
# Only allow crates from crates.io
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
